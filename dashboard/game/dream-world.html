<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>Dreamers World</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gochi+Hand&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#221a3a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:'Fredoka',system-ui,sans-serif;
    color:#fff;
    background:#1a1140;
    position:relative;
  }

  /* ===== DREAMY SKY ===== */
  .sky{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(120% 90% at 20% 12%, #ff8bd6 0%, transparent 45%),
      radial-gradient(120% 90% at 85% 18%, #7cf6ff 0%, transparent 42%),
      radial-gradient(140% 120% at 50% 108%, #ffe66d 0%, transparent 46%),
      linear-gradient(180deg, #6a3cff 0%, #a13cff 30%, #ff4fb8 62%, #ff8a3c 100%);
    animation:skyShift 18s ease-in-out infinite alternate;
  }
  @keyframes skyShift{
    0%{ filter:hue-rotate(0deg) saturate(1.25); }
    100%{ filter:hue-rotate(-18deg) saturate(1.5); }
  }
  /* chalk texture grain */
  .sky::after{
    content:""; position:absolute; inset:0; opacity:.14; mix-blend-mode:overlay;
    background-image:radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.4px);
    background-size:5px 5px;
  }

  /* SVG chalk doodles (stars/sparkles/squiggles) */
  .doodles{ position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.9; }

  /* Drifting art layer */
  .decor{ position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .decor img{
    position:absolute;
    /* THE KEY: black bg drops out over the bright sky */
    mix-blend-mode:screen;
    filter:drop-shadow(0 0 18px rgba(255,255,255,.25)) saturate(1.4) contrast(1.05);
    will-change:transform;
    user-select:none; -webkit-user-drag:none;
  }

  /* ===== INTRO / CLOUD BRIDGE ===== */
  #intro{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; cursor:pointer;
    transition:opacity 1.1s ease, transform 1.1s ease;
  }
  #intro.gone{ opacity:0; transform:scale(1.15); pointer-events:none; }

  .bridge-wrap{
    position:absolute; bottom:-4%; left:50%;
    width:min(1200px,150vw); transform:translateX(-50%);
    pointer-events:none;
  }
  .bridge-wrap img{
    width:100%; display:block;
    mix-blend-mode:screen; filter:saturate(1.4) drop-shadow(0 0 30px rgba(140,246,255,.5));
    animation:bridgeIn 2.4s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes bridgeIn{
    0%{ transform:translateY(60px) scale(.85); opacity:0; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }

  .intro-title{
    font-family:'Gochi Hand',cursive;
    font-size:clamp(48px,12vw,150px);
    line-height:.95; letter-spacing:2px;
    color:#fff;
    text-shadow:
      3px 3px 0 #ff2fa8, -2px -2px 0 #7cf6ff,
      0 0 30px rgba(255,255,255,.6), 6px 8px 0 rgba(34,26,58,.35);
    animation:titlePop 1.4s cubic-bezier(.2,1.4,.4,1) .4s both, floatY 5s ease-in-out 2s infinite;
  }
  .intro-sub{
    margin-top:.4em; font-size:clamp(16px,3.4vw,26px); font-weight:600;
    color:#fff; text-shadow:2px 2px 0 rgba(34,26,58,.4);
    opacity:.95; animation:fadeUp 1s ease 1s both;
  }
  .enter-prompt{
    margin-top:1.6em; font-family:'Gochi Hand',cursive;
    font-size:clamp(26px,6vw,52px); color:#fff;
    padding:.15em .8em; border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,79,184,.35);
    box-shadow:0 0 24px rgba(255,255,255,.5), inset 0 0 20px rgba(255,255,255,.25);
    animation:fadeUp 1s ease 1.6s both, pulseGlow 2.2s ease-in-out 2s infinite;
  }
  @keyframes titlePop{ 0%{transform:scale(.4) rotate(-6deg);opacity:0} 100%{transform:scale(1) rotate(-2deg);opacity:1} }
  @keyframes fadeUp{ 0%{transform:translateY(24px);opacity:0} 100%{transform:translateY(0);opacity:1} }
  @keyframes pulseGlow{ 0%,100%{transform:scale(1);box-shadow:0 0 24px rgba(255,255,255,.5),inset 0 0 20px rgba(255,255,255,.25)} 50%{transform:scale(1.06);box-shadow:0 0 44px rgba(255,255,255,.85),inset 0 0 26px rgba(255,255,255,.4)} }
  @keyframes floatY{ 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-14px) rotate(-2deg)} }

  /* ===== HUB ===== */
  #hub{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; transform:scale(.94); pointer-events:none;
    transition:opacity 1.2s ease .2s, transform 1.2s ease .2s;
    padding:20px;
  }
  #hub.show{ opacity:1; transform:scale(1); pointer-events:auto; }

  .hub-title{
    font-family:'Gochi Hand',cursive;
    font-size:clamp(34px,7vw,76px); line-height:1;
    color:#fff; text-align:center; margin-bottom:.1em;
    text-shadow:3px 3px 0 #7c2fff, -2px -2px 0 #ffe66d, 0 0 26px rgba(255,255,255,.55);
    animation:floatY 6s ease-in-out infinite;
  }
  .hub-sub{
    font-size:clamp(13px,2.6vw,20px); font-weight:500; color:#fff;
    opacity:.92; margin-bottom:clamp(20px,5vh,48px); text-align:center;
    text-shadow:1px 1px 0 rgba(34,26,58,.4);
  }

  .portals{
    display:flex; gap:clamp(24px,6vw,90px);
    flex-wrap:wrap; align-items:center; justify-content:center;
  }
  .portal{
    position:relative; width:clamp(200px,38vw,320px); aspect-ratio:1/1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; border:none; background:none; color:#fff;
    animation:floatY 5.5s ease-in-out infinite;
    transition:transform .3s cubic-bezier(.2,1.5,.4,1);
  }
  .portal:nth-child(2){ animation-delay:-2.6s; }
  .portal:hover,.portal:focus-visible{ transform:scale(1.09); outline:none; }

  .portal .ring{
    position:absolute; inset:0; width:100%; height:100%;
    mix-blend-mode:screen; filter:saturate(1.5) drop-shadow(0 0 22px rgba(124,246,255,.5));
    animation:spinSlow 26s linear infinite;
    transition:filter .3s ease;
  }
  .portal:nth-child(2) .ring{ animation-direction:reverse; }
  .portal:hover .ring,.portal:focus-visible .ring{
    filter:saturate(1.7) brightness(1.25) drop-shadow(0 0 40px rgba(255,255,255,.9));
  }
  @keyframes spinSlow{ to{ transform:rotate(360deg); } }

  /* glowing core behind ring so a failed image still reads as a portal */
  .portal .core{
    position:absolute; width:64%; height:64%; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.35), rgba(124,246,255,.15) 55%, transparent 72%);
    animation:pulseCore 3.2s ease-in-out infinite;
  }
  .portal:nth-child(2) .core{ background:radial-gradient(circle, rgba(255,255,255,.35), rgba(255,79,184,.18) 55%, transparent 72%); animation-delay:-1.4s; }
  @keyframes pulseCore{ 0%,100%{transform:scale(1);opacity:.75} 50%{transform:scale(1.14);opacity:1} }

  .portal .label{
    position:relative; z-index:2; font-family:'Gochi Hand',cursive;
    font-size:clamp(18px,3.8vw,30px); text-align:center; line-height:1.05;
    padding:.25em .6em; max-width:82%;
    text-shadow:2px 2px 0 rgba(34,26,58,.55), 0 0 18px rgba(255,255,255,.5);
    pointer-events:none;
  }
  .portal .icon{ font-size:clamp(30px,7vw,52px); filter:drop-shadow(0 3px 6px rgba(0,0,0,.4)); }

  .hint{
    position:fixed; bottom:14px; left:0; right:0; text-align:center; z-index:12;
    font-size:12px; opacity:.7; letter-spacing:1px; pointer-events:none;
  }

  @media (max-width:520px){
    .portals{ flex-direction:column; gap:26px; }
    .portal{ width:min(72vw,260px); }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
  <div class="sky"></div>

  <!-- chalk doodles -->
  <svg class="doodles" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85">
      <path d="M120 160 l0 60 M90 190 l60 0" />
      <path d="M880 120 l0 44 M858 142 l44 0" />
      <path d="M760 780 q30 -40 60 0 q30 40 60 0" />
      <path d="M150 820 q26 -34 52 0 q26 34 52 0" />
      <circle cx="500" cy="90" r="6" fill="#fff" stroke="none"/>
      <circle cx="300" cy="500" r="5" fill="#ffe66d" stroke="none"/>
      <circle cx="700" cy="420" r="5" fill="#7cf6ff" stroke="none"/>
    </g>
    <g fill="#fff" opacity=".9">
      <path d="M200 300 l7 18 19 2 -14 13 4 19 -16 -10 -16 10 4 -19 -14 -13 19 -2z"/>
      <path d="M820 560 l6 15 16 2 -12 11 3 16 -13 -8 -13 8 3 -16 -12 -11 16 -2z"/>
      <path d="M560 700 l5 12 13 1 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -1z"/>
    </g>
  </svg>

  <!-- drifting real art (black bg dropped via mix-blend-mode:screen) -->
  <div class="decor" id="decor"></div>

  <!-- ===== INTRO ===== -->
  <div id="intro" role="button" tabindex="0" aria-label="Cross the cloud bridge to enter Dreamers World">
    <h1 class="intro-title">DREAMERS<br>WORLD</h1>
    <p class="intro-sub">cross the cloud bridge into the dreamscape</p>
    <div class="enter-prompt">✧ enter ✧</div>
    <div class="bridge-wrap">
      <img id="bridgeImg" src="assets/dreamworld/cloudbridge.png" alt="" />
    </div>
  </div>

  <!-- ===== HUB ===== -->
  <div id="hub">
    <h2 class="hub-title">Where would you<br>like to dream?</h2>
    <p class="hub-sub">step through a floating portal ✦</p>
    <div class="portals">
      <a class="portal" href="dreamers-climb-v25.html" aria-label="Dreamers Climb">
        <img class="ring" src="assets/dreamworld/portal.png" alt="" onerror="this.style.display='none'"/>
        <span class="core"></span>
        <span class="label"><span class="icon">🪜</span><br>DREAMERS<br>CLIMB</span>
      </a>
      <a class="portal" href="dreamer-dashboard-v6.39.html" aria-label="Dreamers Dashboard">
        <img class="ring" src="assets/dreamworld/portal.png" alt="" onerror="this.style.display='none'"/>
        <span class="core"></span>
        <span class="label"><span class="icon">📊</span><br>DREAMERS<br>DASHBOARD</span>
      </a>
    </div>
  </div>

  <div class="hint">a dreamy, agent-free world ✧</div>

<script>
(function(){
  "use strict";
  // hide bridge image if it fails to load
  var b = document.getElementById('bridgeImg');
  if(b){ b.onerror = function(){ this.style.display='none'; }; }

  /* ---------- drifting parallax decor ---------- */
  var decor = document.getElementById('decor');
  var pieces = [
    {src:'planet.png', size:220, count:2},
    {src:'planet.png', size:130, count:2},
    {src:'crown.png',  size:120, count:3},
    {src:'ladder.png', size:150, count:3},
    {src:'cloud.png',  size:260, count:3},
    {src:'cloud.png',  size:160, count:3}
  ];
  var items = [];
  function rand(a,b){ return a + Math.random()*(b-a); }

  pieces.forEach(function(p){
    for(var i=0;i<p.count;i++){
      var img = new Image();
      img.src = 'assets/dreamworld/' + p.src;
      img.alt = '';
      img.onerror = function(){ this.style.display='none'; };
      img.style.width = p.size + 'px';
      decor.appendChild(img);
      items.push({
        el:img,
        x:rand(-5,100), y:rand(-5,100),
        vx:rand(-0.35,0.35)/100, vy:rand(-0.22,0.22)/100,
        drift:rand(6,22), phase:rand(0,Math.PI*2),
        rot:rand(-12,12), rspd:rand(-6,6),
        depth:rand(0.4,1.1)
      });
    }
  });

  var last = performance.now();
  function tick(now){
    var dt = Math.min(50, now - last); last = now;
    var t = now/1000;
    for(var i=0;i<items.length;i++){
      var it = items[i];
      it.x += it.vx * dt * it.depth;
      it.y += it.vy * dt * it.depth;
      // wrap around edges
      if(it.x > 108) it.x = -8; if(it.x < -8) it.x = 108;
      if(it.y > 108) it.y = -8; if(it.y < -8) it.y = 108;
      var bob = Math.sin(t*0.5 + it.phase) * it.drift;
      var rotate = it.rot + Math.sin(t*0.3 + it.phase) * it.rspd;
      it.el.style.transform =
        'translate(' + it.x + 'vw,' + (it.y) + 'vh) translateY(' + bob + 'px) rotate(' + rotate + 'deg)';
      it.el.style.opacity = (0.35 + it.depth*0.5).toFixed(2);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- intro -> hub transition ---------- */
  var intro = document.getElementById('intro');
  var hub = document.getElementById('hub');
  var crossed = false;
  function enter(){
    if(crossed) return; crossed = true;
    intro.classList.add('gone');
    setTimeout(function(){
      intro.style.display='none';
      hub.classList.add('show');
    }, 900);
  }
  intro.addEventListener('click', enter);
  intro.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); enter(); }
  });
  // auto-cross after the entrance animation plays
  var autoTimer = setTimeout(enter, 7000);
  intro.addEventListener('click', function(){ clearTimeout(autoTimer); });
})();
</script>
</body>
</html>
